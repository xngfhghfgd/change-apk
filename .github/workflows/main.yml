name: Rename APK Package
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unpack and Change Package Name
        run: |
          # 使用 GitHub 官方源下载 Apktool
          wget https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O apktool
          wget https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar
          chmod +x apktool
          
          # 反编译 APK（忽略资源错误以防部分加固包报错）
          ./apktool d app.apk -o decompiled
          
          # 将新包名修改为 com.mycustom.tvlauncher（可自行修改）
          sed -i 's/renameManifestPackage: null/renameManifestPackage: com.mycustom.tvlauncher/g' decompiled/apktool.yml
          
          # 重新打包（加入 --use-aapt2 提高现代 APK 的打包成功率）
          ./apktool b decompiled --use-aapt2 -o modified_unsigned.apk

      - name: Sign APK
        run: |
          wget https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O signer.jar
          java -jar signer.jar --apks modified_unsigned.apk

      - name: Upload Modified APK
        uses: actions/upload-artifact@v4
        with:
          name: Modified-APK
          path: modified_unsigned-aligned-debugSigned.apk
